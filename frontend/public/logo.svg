<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" role="img" aria-label="ZyDrive logo">
  <!-- ZyDrive logo — layered green cloud, hand-drawn vector from the
       approved draft (media-generation-zydrive-logo-layered-green-0).
       Three large lobes + one small lobe top-right, flat bottom,
       hollow dip in the middle. No bitmap embedded: pure vector paths.
       Brand green #56E16C is the top stop of the front-right lobe. -->
  <defs>
    <linearGradient id="zy-back-big" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9ECC2"/>
      <stop offset="1" stop-color="#8AD69B"/>
    </linearGradient>
    <linearGradient id="zy-back-small" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9F2D1"/>
      <stop offset="1" stop-color="#97DDA9"/>
    </linearGradient>
    <linearGradient id="zy-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93D5A4"/>
      <stop offset="1" stop-color="#54B874"/>
    </linearGradient>
    <linearGradient id="zy-mid-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CCB90"/>
      <stop offset="1" stop-color="#3E9E60"/>
    </linearGradient>
    <linearGradient id="zy-front-left" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46B268"/>
      <stop offset="0.55" stop-color="#1F8A46"/>
      <stop offset="1" stop-color="#0E5A2C"/>
    </linearGradient>
    <linearGradient id="zy-front-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56E16C"/>
      <stop offset="0.55" stop-color="#2BAE5C"/>
      <stop offset="1" stop-color="#128A44"/>
    </linearGradient>
    <clipPath id="zy-flat-bottom">
      <rect x="0" y="0" width="200" height="148" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#zy-flat-bottom)">
    <!-- back layer: large dome top-left, small dome top-right -->
    <circle cx="140" cy="60" r="30" fill="url(#zy-back-small)"/>
    <circle cx="78" cy="82" r="50" fill="url(#zy-back-big)"/>
    <!-- middle layer: wide dome -->
    <ellipse cx="128" cy="102" rx="58" ry="42" fill="url(#zy-mid)"/>
    <ellipse cx="166" cy="100" rx="28" ry="22" fill="url(#zy-mid-right)"/>
    <!-- front layer: big circle bottom-left -->
    <circle cx="52" cy="118" r="46" fill="url(#zy-front-left)"/>
    <!-- front layer: bottom-right lobe, two overlapping circles
         so the top edge dips in the middle (hollow) -->
    <circle cx="112" cy="120" r="36" fill="url(#zy-front-right)"/>
    <circle cx="168" cy="122" r="32" fill="url(#zy-front-right)"/>
  </g>
</svg>
